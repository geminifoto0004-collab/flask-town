name: Import TOWN from main Flask

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-town.yml'

permissions:
  contents: write

jobs:
  import-town:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned stable source
        run: |
          git clone https://github.com/geminifoto0004-collab/flask.git /tmp/flask-source
          cd /tmp/flask-source
          git checkout bfa530c287c19a22f883035e17b243630902f230

      - name: Copy standalone TOWN runtime
        run: |
          mkdir -p blueprints templates
          cp /tmp/flask-source/town_app.py ./town_app.py
          cp /tmp/flask-source/requirements-town.txt ./requirements-town.txt
          cp /tmp/flask-source/TOWN_RENDER_SETUP.md ./TOWN_RENDER_SETUP.md
          cp /tmp/flask-source/.python-version ./.python-version
          cp /tmp/flask-source/templates/customs_agent_town.html ./templates/customs_agent_town.html

          find /tmp/flask-source/blueprints -maxdepth 1 -type f -name 'town_*.py' -exec cp {} ./blueprints/ \;
          cp -R /tmp/flask-source/blueprints/town_latest_chunks ./blueprints/
          cp -R /tmp/flask-source/blueprints/town_v152_chunks ./blueprints/

          cat > blueprints/__init__.py <<'PY'
          """Standalone TOWN blueprint package.

          This repository intentionally contains only the TOWN runtime and does
          not import the main Flask/ORDER blueprints.
          """
          PY

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .env
          .venv/
          venv/
          .pytest_cache/
          *.log
          EOF

      - name: Verify required standalone files
        run: |
          test -f town_app.py
          test -f requirements-town.txt
          test -f blueprints/town_ai_bp.py
          test -f blueprints/town_world_tidb_runtime.py
          test -f blueprints/town_dialogue_tidb_runtime.py
          test -f blueprints/town_latest_chunks/01.txt
          python -m py_compile town_app.py blueprints/town_*.py

      - name: Commit imported TOWN runtime
        run: |
          rm -f .github/workflows/import-town.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import standalone TOWN runtime from stable Flask commit"
          git push origin main
