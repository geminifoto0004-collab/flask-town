name: Verify standalone TOWN

on:
  push:
    branches: [main]
    paths:
      - 'database.py'
      - '.github/workflows/verify-town.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TOWN requirements
        run: pip install -r requirements-town.txt
      - name: Import standalone app
        env:
          DATABASE_TYPE: tidb
          DEEPSEEK_API_KEY: test-only
          TOWN_ADMIN_PASSWORD: test-only
          TOWN_SECRET_KEY: test-only
        run: |
          python - <<'PY'
          import town_app
          rules = sorted(str(rule) for rule in town_app.app.url_map.iter_rules())
          assert '/health' in rules
          assert '/customs-town' in rules
          assert any(rule.startswith('/api/town') for rule in rules)
          print('Standalone TOWN import OK')
          print('\n'.join(rules))
          PY
      - name: Remove one-time verification workflow
        if: success()
        run: |
          rm -f .github/workflows/verify-town.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time TOWN verification workflow"
          git push origin main
